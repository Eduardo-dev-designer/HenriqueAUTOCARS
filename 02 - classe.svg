<svg viewBox="0 0 1250 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1250" height="780" fill="#ffffff"/>
  <rect x="10" y="10" width="1230" height="760" rx="10" fill="none" stroke="#8a5fc4" stroke-width="2"/>
  <rect x="10" y="10" width="1230" height="42" rx="10" fill="#e6dcf7" stroke="#8a5fc4" stroke-width="2"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#3d2266">Diagrama de Classes e Relacionamentos (UML 2.5)</text>

  <!-- Cliente -->
  <g>
    <rect x="40" y="80" width="240" height="292" fill="#e6dcf7" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="40" y="80" width="240" height="32" fill="#d3bdf0" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="160" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#3d2266">Cliente</text>
    <line x1="40" y1="112" x2="280" y2="112" stroke="#6b3fa0"/>
    <text x="50" y="132" font-size="12" fill="#222">- idCliente: int</text>
    <text x="50" y="150" font-size="12" fill="#222">- nome: String</text>
    <text x="50" y="168" font-size="12" fill="#222">- cpf: String</text>
    <text x="50" y="186" font-size="12" fill="#222">- email: String</text>
    <text x="50" y="204" font-size="12" fill="#222">- telefone: String</text>
    <text x="50" y="222" font-size="12" fill="#222">- senha: String (hash)</text>
    <text x="50" y="240" font-size="12" fill="#222">- dataNascimento: Date</text>
    <text x="50" y="258" font-size="12" fill="#222">- dataAdmissaoEmprego: Date</text>
    <line x1="40" y1="268" x2="280" y2="268" stroke="#6b3fa0"/>
    <text x="50" y="288" font-size="12" fill="#222">+ fazerLogin(loginId, senha): boolean</text>
    <text x="50" y="306" font-size="12" fill="#222">+ enviarDadosValidacao(): void</text>
    <text x="50" y="324" font-size="12" fill="#222">+ selecionarVeiculo(): void</text>
    <text x="50" y="342" font-size="12" fill="#222">+ calcularIdade(): int</text>
    <text x="50" y="360" font-size="12" fill="#222">+ calcularTempoTrabalho(): double</text>
  </g>

  <!-- Score -->
  <g>
    <rect x="360" y="80" width="250" height="230" fill="#cdeef0" stroke="#1a7f86" stroke-width="1.5"/>
    <rect x="360" y="80" width="250" height="32" fill="#a3dde0" stroke="#1a7f86" stroke-width="1.5"/>
    <text x="485" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f4548">Score</text>
    <line x1="360" y1="112" x2="610" y2="112" stroke="#1a7f86"/>
    <text x="370" y="132" font-size="12" fill="#222">- idScore: int</text>
    <text x="370" y="150" font-size="12" fill="#222">- idCliente: int</text>
    <text x="370" y="168" font-size="12" fill="#222">- idade: int</text>
    <text x="370" y="186" font-size="12" fill="#222">- tempoTrabalho: double (anos)</text>
    <text x="370" y="204" font-size="12" fill="#222">- pontuacao: double</text>
    <text x="370" y="222" font-size="12" fill="#222">- classificacao: String</text>
    <text x="370" y="240" font-size="11" font-style="italic" fill="#0f4548">  (Bom | Baixo | Alto)</text>
    <line x1="360" y1="250" x2="610" y2="250" stroke="#1a7f86"/>
    <text x="370" y="270" font-size="12" fill="#222">+ calcularScore(): double</text>
    <text x="370" y="288" font-size="12" fill="#222">+ classificarScore(): String</text>
  </g>
  <text x="485" y="330" font-size="10.5" font-style="italic" text-anchor="middle" fill="#0f4548">pontuacao = f(idade, tempoTrabalho)</text>

  <!-- Compra -->
  <g>
    <rect x="670" y="80" width="220" height="170" fill="#fdeecb" stroke="#c48a1e" stroke-width="1.5"/>
    <rect x="670" y="80" width="220" height="32" fill="#fbdd9a" stroke="#c48a1e" stroke-width="1.5"/>
    <text x="780" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#5c3d0a">Compra</text>
    <line x1="670" y1="112" x2="890" y2="112" stroke="#c48a1e"/>
    <text x="680" y="132" font-size="12" fill="#222">- idCompra: int</text>
    <text x="680" y="150" font-size="12" fill="#222">- data: Date</text>
    <text x="680" y="168" font-size="12" fill="#222">- status: String</text>
    <line x1="670" y1="178" x2="890" y2="178" stroke="#c48a1e"/>
    <text x="680" y="198" font-size="12" fill="#222">+ registrarCompra(): void</text>
    <text x="680" y="216" font-size="12" fill="#222">+ validarDados(): boolean</text>
  </g>

  <!-- Veiculo -->
  <g>
    <rect x="950" y="80" width="270" height="235" fill="#fdf2cb" stroke="#c4a41e" stroke-width="1.5"/>
    <rect x="950" y="80" width="270" height="32" fill="#f8e6a0" stroke="#c4a41e" stroke-width="1.5"/>
    <text x="1085" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#5c4d0a">Veiculo</text>
    <line x1="950" y1="112" x2="1220" y2="112" stroke="#c4a41e"/>
    <text x="960" y="132" font-size="12" fill="#222">- idVeiculo: int</text>
    <text x="960" y="150" font-size="12" fill="#222">- marca: String</text>
    <text x="960" y="168" font-size="12" fill="#222">- modelo: String</text>
    <text x="960" y="186" font-size="12" fill="#222">- cor: String</text>
    <text x="960" y="204" font-size="12" fill="#222">- kmRodado: double</text>
    <text x="960" y="222" font-size="12" fill="#222">- ano: int</text>
    <line x1="950" y1="232" x2="1220" y2="232" stroke="#c4a41e"/>
    <text x="960" y="252" font-size="12" fill="#222">+ cadastrarVeiculo(): void</text>
    <text x="960" y="270" font-size="12" fill="#222">+ verificarDisponibilidade(): boolean</text>
  </g>

  <!-- Locacao -->
  <g>
    <rect x="670" y="440" width="240" height="206" fill="#e6dcf7" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="670" y="440" width="240" height="32" fill="#d3bdf0" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="790" y="462" font-size="15" font-weight="bold" text-anchor="middle" fill="#3d2266">Locacao</text>
    <line x1="670" y1="472" x2="910" y2="472" stroke="#6b3fa0"/>
    <text x="680" y="492" font-size="12" fill="#222">- idLocacao: int</text>
    <text x="680" y="510" font-size="12" fill="#222">- idFuncionario: int</text>
    <text x="680" y="528" font-size="12" fill="#222">- dataVenda: Date</text>
    <text x="680" y="546" font-size="12" fill="#222">- valor: double</text>
    <line x1="670" y1="556" x2="910" y2="556" stroke="#6b3fa0"/>
    <text x="680" y="576" font-size="12" fill="#222">+ registrarVenda(): void</text>
    <text x="680" y="594" font-size="12" fill="#222">+ atualizarEstoque(): void</text>
  </g>

  <!-- Estoque -->
  <g>
    <rect x="1000" y="440" width="240" height="150" fill="#fbdada" stroke="#c43a3a" stroke-width="1.5"/>
    <rect x="1000" y="440" width="240" height="32" fill="#f6bcbc" stroke="#c43a3a" stroke-width="1.5"/>
    <text x="1120" y="462" font-size="15" font-weight="bold" text-anchor="middle" fill="#5c1a1a">Estoque</text>
    <line x1="1000" y1="472" x2="1240" y2="472" stroke="#c43a3a"/>
    <text x="1010" y="492" font-size="12" fill="#222">- idEstoque: int</text>
    <text x="1010" y="510" font-size="12" fill="#222">- quantidade: int</text>
    <text x="1010" y="528" font-size="12" fill="#222">- valor: double</text>
    <line x1="1000" y1="538" x2="1240" y2="538" stroke="#c43a3a"/>
    <text x="1010" y="558" font-size="12" fill="#222">+ atualizarQuantidade(): void</text>
  </g>

  <!-- Funcionario -->
  <g>
    <rect x="40" y="440" width="240" height="160" fill="#e6dcf7" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="40" y="440" width="240" height="32" fill="#d3bdf0" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="160" y="462" font-size="15" font-weight="bold" text-anchor="middle" fill="#3d2266">Funcionario</text>
    <line x1="40" y1="472" x2="280" y2="472" stroke="#6b3fa0"/>
    <text x="50" y="492" font-size="12" fill="#222">- idFuncionario: int</text>
    <text x="50" y="510" font-size="12" fill="#222">- nome: String</text>
    <text x="50" y="528" font-size="12" fill="#222">- matricula: String</text>
    <text x="50" y="546" font-size="12" fill="#222">- senha: String (hash)</text>
    <line x1="40" y1="556" x2="280" y2="556" stroke="#6b3fa0"/>
    <text x="50" y="576" font-size="12" fill="#222">+ fazerLogin(matricula, senha): boolean</text>
  </g>

  <!-- Funcionario -> Locacao : realiza -->
  <line x1="280" y1="520" x2="670" y2="520" stroke="#333" stroke-width="1.3"/>
  <text x="288" y="513" font-size="11" fill="#333">1</text>
  <text x="635" y="513" font-size="11" fill="#333">0..*</text>
  <text x="440" y="513" font-size="12" font-weight="bold" fill="#333">realiza</text>

  <!-- Relationships -->
  <!-- Cliente -> Score : possui -->
  <line x1="280" y1="180" x2="360" y2="180" stroke="#333" stroke-width="1.3"/>
  <text x="288" y="173" font-size="11" fill="#333">1</text>
  <text x="335" y="173" font-size="11" fill="#333">1</text>
  <text x="295" y="195" font-size="12" font-weight="bold" fill="#333">possui</text>

  <!-- Cliente -> Compra : realiza (rota em ângulo reto, abaixo da caixa Score, sem cruzá-la) -->
  <path d="M160,372 L160,410 L670,410 L670,250" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="168" y="386" font-size="11" fill="#333">1</text>
  <text x="678" y="265" font-size="11" fill="#333">0..*</text>
  <text x="330" y="425" font-size="12" font-weight="bold" fill="#333">realiza</text>

  <!-- Compra -> Veiculo : refere-se a -->
  <line x1="890" y1="170" x2="950" y2="170" stroke="#333" stroke-width="1.3"/>
  <text x="896" y="163" font-size="11" fill="#333">0..*</text>
  <text x="925" y="163" font-size="11" fill="#333">1</text>
  <text x="900" y="182" font-size="12" font-weight="bold" fill="#333">refere-se a</text>

  <!-- Veiculo -> Locacao : possui -->
  <line x1="1060" y1="315" x2="800" y2="440" stroke="#333" stroke-width="1.3"/>
  <text x="970" y="345" font-size="11" fill="#333">1</text>
  <text x="820" y="432" font-size="11" fill="#333">0..*</text>
  <text x="890" y="380" font-size="12" font-weight="bold" fill="#333">possui</text>

  <!-- Locacao -> Estoque : gera -->
  <line x1="910" y1="548" x2="1000" y2="548" stroke="#333" stroke-width="1.3"/>
  <text x="918" y="541" font-size="11" fill="#333">0..*</text>
  <text x="978" y="541" font-size="11" fill="#333">1</text>
  <text x="925" y="561" font-size="12" font-weight="bold" fill="#333">gera</text>

  <!-- Veiculo -> Estoque -->
  <line x1="1180" y1="315" x2="1120" y2="440" stroke="#333" stroke-width="1.3"/>
  <text x="1150" y="345" font-size="11" fill="#333">1</text>
  <text x="1130" y="432" font-size="11" fill="#333">0..*</text>
</svg>
