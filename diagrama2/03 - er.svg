<svg viewBox="0 0 1450 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1450" height="800" fill="#ffffff"/>
  <rect x="10" y="10" width="1430" height="780" rx="10" fill="none" stroke="#3fa35a" stroke-width="2"/>
  <rect x="10" y="10" width="1430" height="42" rx="10" fill="#d9f2da" stroke="#3fa35a" stroke-width="2"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#1e4d20">Diagrama de Banco de Dados (UML 2.5)</text>

  <!-- cliente -->
  <g>
    <rect x="40" y="90" width="220" height="230" fill="#eaf4ff" stroke="#3b6fae" stroke-width="1.5"/>
    <rect x="40" y="90" width="220" height="30" fill="#cfe3fb" stroke="#3b6fae" stroke-width="1.5"/>
    <text x="150" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#173a63">cliente</text>
    <text x="50" y="140" font-size="12" font-weight="bold" fill="#173a63">PK</text>
    <text x="90" y="140" font-size="12" font-weight="bold" fill="#173a63">id_cliente  INT</text>
    <line x1="40" y1="150" x2="260" y2="150" stroke="#3b6fae"/>
    <text x="90" y="168" font-size="12" fill="#222">nome  VARCHAR(100)</text>
    <text x="90" y="188" font-size="12" fill="#222">cpf  VARCHAR(14)</text>
    <text x="90" y="208" font-size="12" fill="#222">email  VARCHAR(100)</text>
    <text x="90" y="228" font-size="12" fill="#222">telefone  VARCHAR(20)</text>
    <text x="90" y="248" font-size="12" fill="#222">senha_hash  VARCHAR(255)</text>
    <text x="90" y="268" font-size="12" fill="#222">data_nascimento  DATE</text>
    <text x="90" y="288" font-size="12" fill="#222">data_admissao  DATE</text>
  </g>

  <!-- score -->
  <g>
    <rect x="320" y="90" width="240" height="190" fill="#d5f2f3" stroke="#1a7f86" stroke-width="1.5"/>
    <rect x="320" y="90" width="240" height="30" fill="#aee4e6" stroke="#1a7f86" stroke-width="1.5"/>
    <text x="440" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f4548">score</text>
    <text x="330" y="140" font-size="12" font-weight="bold" fill="#0f4548">PK</text>
    <text x="370" y="140" font-size="12" font-weight="bold" fill="#0f4548">id_score  INT</text>
    <text x="330" y="160" font-size="12" font-weight="bold" fill="#0f4548">FK</text>
    <text x="370" y="160" font-size="12" fill="#222">id_cliente  INT</text>
    <line x1="320" y1="170" x2="560" y2="170" stroke="#1a7f86"/>
    <text x="370" y="188" font-size="12" fill="#222">idade  INT</text>
    <text x="370" y="208" font-size="12" fill="#222">tempo_trabalho  DECIMAL(5,2)</text>
    <text x="370" y="228" font-size="12" fill="#222">pontuacao  DECIMAL(6,2)</text>
    <text x="370" y="248" font-size="12" fill="#222">classificacao  VARCHAR(10)</text>
    <text x="370" y="264" font-size="10.5" font-style="italic" fill="#0f4548">(Bom | Baixo | Alto)</text>
  </g>

  <!-- dados_validacao -->
  <g>
    <rect x="610" y="90" width="220" height="200" fill="#eaf4ff" stroke="#3b6fae" stroke-width="1.5"/>
    <rect x="610" y="90" width="220" height="30" fill="#cfe3fb" stroke="#3b6fae" stroke-width="1.5"/>
    <text x="720" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#173a63">dados_validacao</text>
    <text x="620" y="140" font-size="12" font-weight="bold" fill="#173a63">PK</text>
    <text x="660" y="140" font-size="12" font-weight="bold" fill="#173a63">id_dado  INT</text>
    <text x="620" y="160" font-size="12" font-weight="bold" fill="#173a63">FK</text>
    <text x="660" y="160" font-size="12" fill="#222">id_compra  INT</text>
    <line x1="610" y1="170" x2="830" y2="170" stroke="#3b6fae"/>
    <text x="660" y="188" font-size="12" fill="#222">tipo  VARCHAR(50)</text>
    <text x="660" y="208" font-size="12" fill="#222">valor  VARCHAR(255)</text>
    <text x="660" y="228" font-size="12" fill="#222">data_envio  DATE</text>
    <text x="660" y="248" font-size="12" fill="#222">status  VARCHAR(20)</text>
  </g>

  <!-- compra -->
  <g>
    <rect x="890" y="90" width="220" height="190" fill="#fdeecb" stroke="#c48a1e" stroke-width="1.5"/>
    <rect x="890" y="90" width="220" height="30" fill="#fbdd9a" stroke="#c48a1e" stroke-width="1.5"/>
    <text x="1000" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#5c3d0a">compra</text>
    <text x="900" y="140" font-size="12" font-weight="bold" fill="#5c3d0a">PK</text>
    <text x="940" y="140" font-size="12" font-weight="bold" fill="#5c3d0a">id_compra  INT</text>
    <text x="900" y="160" font-size="12" font-weight="bold" fill="#5c3d0a">FK</text>
    <text x="940" y="160" font-size="12" fill="#222">id_cliente  INT</text>
    <text x="900" y="180" font-size="12" font-weight="bold" fill="#5c3d0a">FK</text>
    <text x="940" y="180" font-size="12" fill="#222">id_veiculo  INT</text>
    <line x1="890" y1="190" x2="1110" y2="190" stroke="#c48a1e"/>
    <text x="940" y="208" font-size="12" fill="#222">data_compra  DATE</text>
    <text x="940" y="228" font-size="12" fill="#222">status  VARCHAR(20)</text>
  </g>

  <!-- veiculo -->
  <g>
    <rect x="1170" y="90" width="230" height="200" fill="#fbdada" stroke="#c43a3a" stroke-width="1.5"/>
    <rect x="1170" y="90" width="230" height="30" fill="#f6bcbc" stroke="#c43a3a" stroke-width="1.5"/>
    <text x="1285" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#5c1a1a">veiculo</text>
    <text x="1180" y="140" font-size="12" font-weight="bold" fill="#5c1a1a">PK</text>
    <text x="1220" y="140" font-size="12" font-weight="bold" fill="#5c1a1a">id_veiculo  INT</text>
    <line x1="1170" y1="150" x2="1400" y2="150" stroke="#c43a3a"/>
    <text x="1220" y="168" font-size="12" fill="#222">marca  VARCHAR(50)</text>
    <text x="1220" y="188" font-size="12" fill="#222">modelo  VARCHAR(50)</text>
    <text x="1220" y="208" font-size="12" fill="#222">cor  VARCHAR(30)</text>
    <text x="1220" y="228" font-size="12" fill="#222">km_rodado  DECIMAL(10,2)</text>
    <text x="1220" y="248" font-size="12" fill="#222">ano  INT</text>
  </g>

  <!-- locacao (venda) -->
  <g>
    <rect x="890" y="420" width="220" height="170" fill="#e6dcf7" stroke="#6b3fa0" stroke-width="1.5"/>
    <rect x="890" y="420" width="220" height="30" fill="#d3bdf0" stroke="#6b3fa0" stroke-width="1.5"/>
    <text x="1000" y="440" font-size="14" font-weight="bold" text-anchor="middle" fill="#3d2266">locacao (venda)</text>
    <text x="900" y="470" font-size="12" font-weight="bold" fill="#3d2266">PK</text>
    <text x="940" y="470" font-size="12" font-weight="bold" fill="#3d2266">id_locacao  INT</text>
    <text x="900" y="490" font-size="12" font-weight="bold" fill="#3d2266">FK</text>
    <text x="940" y="490" font-size="12" fill="#222">id_veiculo  INT</text>
    <text x="900" y="510" font-size="12" font-weight="bold" fill="#3d2266">FK</text>
    <text x="940" y="510" font-size="12" fill="#222">id_funcionario  INT</text>
    <line x1="890" y1="520" x2="1110" y2="520" stroke="#6b3fa0"/>
    <text x="940" y="538" font-size="12" fill="#222">data_venda  DATE</text>
    <text x="940" y="558" font-size="12" fill="#222">valor  DECIMAL(10,2)</text>
  </g>

  <!-- estoque -->
  <g>
    <rect x="1170" y="420" width="180" height="160" fill="#d9f2da" stroke="#3fa35a" stroke-width="1.5"/>
    <rect x="1170" y="420" width="180" height="30" fill="#bfe8c4" stroke="#3fa35a" stroke-width="1.5"/>
    <text x="1260" y="440" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e4d20">estoque</text>
    <text x="1180" y="470" font-size="12" font-weight="bold" fill="#1e4d20">PK</text>
    <text x="1215" y="470" font-size="11" font-weight="bold" fill="#1e4d20">id_estoque INT</text>
    <text x="1180" y="490" font-size="12" font-weight="bold" fill="#1e4d20">FK</text>
    <text x="1215" y="490" font-size="11" fill="#222">id_veiculo INT</text>
    <line x1="1170" y1="500" x2="1350" y2="500" stroke="#3fa35a"/>
    <text x="1180" y="518" font-size="11" fill="#222">quantidade  INT</text>
    <text x="1180" y="538" font-size="11" fill="#222">valor  DECIMAL(10,2)</text>
  </g>

  <!-- funcionario -->
  <g>
    <rect x="40" y="420" width="220" height="180" fill="#eaf4ff" stroke="#3b6fae" stroke-width="1.5"/>
    <rect x="40" y="420" width="220" height="30" fill="#cfe3fb" stroke="#3b6fae" stroke-width="1.5"/>
    <text x="150" y="440" font-size="14" font-weight="bold" text-anchor="middle" fill="#173a63">funcionario</text>
    <text x="50" y="470" font-size="12" font-weight="bold" fill="#173a63">PK</text>
    <text x="90" y="470" font-size="12" font-weight="bold" fill="#173a63">id_funcionario  INT</text>
    <line x1="40" y1="480" x2="260" y2="480" stroke="#3b6fae"/>
    <text x="90" y="498" font-size="12" fill="#222">matricula  VARCHAR(20)</text>
    <text x="90" y="518" font-size="12" fill="#222">nome  VARCHAR(100)</text>
    <text x="90" y="538" font-size="12" fill="#222">senha_hash  VARCHAR(255)</text>
    <text x="90" y="558" font-size="12" fill="#222">cargo  VARCHAR(50)</text>
  </g>

  <!-- funcionario -> locacao -->
  <line x1="260" y1="500" x2="890" y2="500" stroke="#333" stroke-width="1.3"/>
  <text x="266" y="493" font-size="11" fill="#333">1</text>
  <text x="860" y="493" font-size="11" fill="#333">0..*</text>

  <!-- Relationships -->
  <!-- cliente -> score -->
  <line x1="260" y1="170" x2="320" y2="170" stroke="#333" stroke-width="1.3"/>
  <text x="266" y="163" font-size="11" fill="#333">1</text>
  <text x="295" y="163" font-size="11" fill="#333">1</text>

  <!-- cliente -> compra (roteada por cima de todas as tabelas, sem cruzar nenhuma outra linha) -->
  <path d="M150,90 L150,65 L1000,65 L1000,90" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="155" y="80" font-size="11" fill="#333">1</text>
  <text x="1008" y="80" font-size="11" fill="#333">0..*</text>

  <!-- documentacao -> compra -->
  <line x1="830" y1="160" x2="890" y2="160" stroke="#333" stroke-width="1.3"/>
  <text x="838" y="153" font-size="11" fill="#333">0..*</text>
  <text x="868" y="153" font-size="11" fill="#333">1</text>

  <!-- compra -> veiculo -->
  <line x1="1110" y1="180" x2="1170" y2="180" stroke="#333" stroke-width="1.3"/>
  <text x="1116" y="173" font-size="11" fill="#333">0..*</text>
  <text x="1148" y="173" font-size="11" fill="#333">1</text>

  <!-- veiculo -> estoque -->
  <line x1="1260" y1="290" x2="1260" y2="420" stroke="#333" stroke-width="1.3"/>
  <text x="1266" y="310" font-size="11" fill="#333">1</text>
  <text x="1266" y="410" font-size="11" fill="#333">0..*</text>

  <!-- veiculo -> locacao -->
  <path d="M1170,250 C1050,300 1000,350 1000,420" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="1130" y="270" font-size="11" fill="#333">1</text>
  <text x="1008" y="410" font-size="11" fill="#333">0..*</text>

  <text x="30" y="740" font-size="11" fill="#555">PK = Chave Primária   FK = Chave Estrangeira   |   pontuacao = f(idade, tempo_trabalho)</text>
</svg>
