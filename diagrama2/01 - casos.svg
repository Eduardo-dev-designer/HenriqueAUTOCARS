<svg viewBox="0 0 1180 970" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1180" height="970" fill="#ffffff"/>
  <rect x="10" y="10" width="1160" height="950" rx="10" fill="none" stroke="#3b82c4" stroke-width="2"/>
  <rect x="10" y="10" width="1160" height="42" rx="10" fill="#cfe8fa" stroke="#3b82c4" stroke-width="2"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#14395c">Diagrama de Caso de Uso (UML 2.5)</text>

  <!-- system boundary -->
  <rect x="140" y="90" width="880" height="815" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="580" y="112" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Sistema de Compra e Venda de Veículos por Score</text>

  <!-- ===================== Cliente actor ===================== -->
  <g stroke="#1e5fae" stroke-width="2" fill="none">
    <circle cx="65" cy="290" r="14" fill="#ffffff"/>
    <line x1="65" y1="304" x2="65" y2="350"/>
    <line x1="35" y1="320" x2="95" y2="320"/>
    <line x1="65" y1="350" x2="40" y2="385"/>
    <line x1="65" y1="350" x2="90" y2="385"/>
  </g>
  <text x="65" y="405" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e5fae">Cliente</text>

  <!-- 1) Fazer Login: primeira ação do cliente -->
  <ellipse cx="280" cy="175" rx="122" ry="46" fill="#fde2e2" stroke="#b03030" stroke-width="1.5"/>
  <text x="280" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#7a1f1f">1. Fazer Login</text>
  <text x="280" y="182" font-size="12" text-anchor="middle" fill="#7a1f1f">(Email ou CPF</text>
  <text x="280" y="198" font-size="12" text-anchor="middle" fill="#7a1f1f">e Senha)</text>

  <!-- 2) Enviar Documentos de Validação -->
  <ellipse cx="280" cy="295" rx="115" ry="38" fill="#cfe8fa" stroke="#1e5fae" stroke-width="1.5"/>
  <text x="280" y="285" font-size="12.5" text-anchor="middle" fill="#14395c">2. Enviar Dados</text>
  <text x="280" y="302" font-size="12.5" text-anchor="middle" fill="#14395c">de Validação</text>

  <!-- include: Validar Dados Enviados -->
  <ellipse cx="545" cy="295" rx="130" ry="36" fill="#cfe8fa" stroke="#1e5fae" stroke-width="1.5"/>
  <text x="545" y="300" font-size="13" text-anchor="middle" fill="#14395c">Validar Dados Enviados</text>
  <line x1="395" y1="295" x2="415" y2="295" stroke="#1e5fae" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="405" y="283" font-size="11" text-anchor="middle" fill="#1e5fae">&lt;&lt;include&gt;&gt;</text>

  <!-- 3) Consultar Score -->
  <ellipse cx="280" cy="435" rx="115" ry="38" fill="#cfe8fa" stroke="#1e5fae" stroke-width="1.5"/>
  <text x="280" y="425" font-size="13" text-anchor="middle" fill="#14395c">3. Consultar Score</text>
  <text x="280" y="442" font-size="13" text-anchor="middle" fill="#14395c">do Cliente</text>

  <!-- include: Calcular Score -->
  <ellipse cx="545" cy="435" rx="140" ry="52" fill="#cfe8fa" stroke="#1e5fae" stroke-width="1.5"/>
  <text x="545" y="420" font-size="13" text-anchor="middle" fill="#14395c">Calcular Score do Cliente</text>
  <text x="545" y="437" font-size="11.5" text-anchor="middle" fill="#14395c">com base em Idade e</text>
  <text x="545" y="452" font-size="11.5" text-anchor="middle" fill="#14395c">Tempo de Trabalho</text>
  <text x="545" y="470" font-size="12" text-anchor="middle" fill="#14395c">(Bom / Baixo / Alto)</text>
  <line x1="395" y1="435" x2="405" y2="435" stroke="#1e5fae" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="401" y="423" font-size="11" text-anchor="middle" fill="#1e5fae">&lt;&lt;include&gt;&gt;</text>

  <!-- ordem de execução: 1 Login -> 2 Enviar Documentos -> 3 Consultar Score -->
  <line x1="280" y1="221" x2="280" y2="257" stroke="#888" stroke-width="1.3" stroke-dasharray="2,3"/>
  <line x1="280" y1="333" x2="280" y2="397" stroke="#888" stroke-width="1.3" stroke-dasharray="2,3"/>

  <!-- Cliente actor: liga-se às 3 ações, na ordem em que ocorrem -->
  <line x1="95" y1="300" x2="165" y2="190" stroke="#222" stroke-width="1.3"/>
  <line x1="95" y1="310" x2="165" y2="295" stroke="#222" stroke-width="1.3"/>
  <line x1="95" y1="325" x2="165" y2="425" stroke="#222" stroke-width="1.3"/>

  <!-- ===================== Extend: listas por faixa de score ===================== -->
  <ellipse cx="850" cy="285" rx="150" ry="42" fill="#fdeecb" stroke="#c48a1e" stroke-width="1.5"/>
  <text x="850" y="280" font-size="12.5" text-anchor="middle" fill="#5c3d0a">Selecionar Veículo</text>
  <text x="850" y="297" font-size="12.5" text-anchor="middle" fill="#5c3d0a">Lista Score Alto</text>

  <ellipse cx="850" cy="435" rx="150" ry="42" fill="#fdeecb" stroke="#c48a1e" stroke-width="1.5"/>
  <text x="850" y="430" font-size="12.5" text-anchor="middle" fill="#5c3d0a">Selecionar Veículo</text>
  <text x="850" y="447" font-size="12.5" text-anchor="middle" fill="#5c3d0a">Lista Score Bom</text>

  <ellipse cx="850" cy="585" rx="150" ry="42" fill="#fdeecb" stroke="#c48a1e" stroke-width="1.5"/>
  <text x="850" y="580" font-size="12.5" text-anchor="middle" fill="#5c3d0a">Selecionar Veículo</text>
  <text x="850" y="597" font-size="12.5" text-anchor="middle" fill="#5c3d0a">Lista Score Baixo</text>

  <!-- extend arrows pointing to base use case "Calcular Score" (param exatamente na borda, não entram na bolha) -->
  <path d="M700,285 C650,315 625,355 615,390" fill="none" stroke="#c48a1e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowo)"/>
  <text x="700" y="335" font-size="11" fill="#8a5a0a">&lt;&lt;extend&gt;&gt;</text>
  <text x="700" y="349" font-size="10" font-style="italic" fill="#8a5a0a">{score = alto}</text>

  <line x1="700" y1="435" x2="687" y2="435" stroke="#c48a1e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowo)"/>
  <text x="691" y="423" font-size="11" fill="#8a5a0a">&lt;&lt;extend&gt;&gt;</text>
  <text x="700" y="470" font-size="10" font-style="italic" fill="#8a5a0a">{score = bom}</text>

  <path d="M700,585 C650,555 625,515 615,480" fill="none" stroke="#c48a1e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowo)"/>
  <text x="700" y="535" font-size="11" fill="#8a5a0a">&lt;&lt;extend&gt;&gt;</text>
  <text x="695" y="549" font-size="10" font-style="italic" fill="#8a5a0a">{score = baixo}</text>

  <!-- ===================== Locação: gestão de vendas e estoque ===================== -->
  <ellipse cx="545" cy="657" rx="140" ry="38" fill="#d9f2da" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="545" y="652" font-size="13" text-anchor="middle" fill="#1e4d20">Gerenciar Vendas</text>
  <text x="545" y="669" font-size="13" text-anchor="middle" fill="#1e4d20">de Veículos</text>

  <ellipse cx="280" cy="657" rx="130" ry="38" fill="#d9f2da" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="280" y="652" font-size="13" text-anchor="middle" fill="#1e4d20">Registrar Venda /</text>
  <text x="280" y="669" font-size="13" text-anchor="middle" fill="#1e4d20">Cadastrar Veículo</text>

  <line x1="405" y1="657" x2="420" y2="657" stroke="#2f7d32" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowg)"/>
  <text x="412" y="645" font-size="11" text-anchor="middle" fill="#2f7d32">&lt;&lt;include&gt;&gt;</text>

  <ellipse cx="545" cy="747" rx="120" ry="36" fill="#d9f2da" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="545" y="752" font-size="13" text-anchor="middle" fill="#1e4d20">Gerenciar Estoque</text>

  <ellipse cx="280" cy="747" rx="135" ry="36" fill="#d9f2da" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="280" y="743" font-size="13" text-anchor="middle" fill="#1e4d20">Atualizar Quantidade</text>
  <text x="280" y="760" font-size="13" text-anchor="middle" fill="#1e4d20">e Valor</text>

  <line x1="415" y1="747" x2="425" y2="747" stroke="#2f7d32" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowg)"/>
  <text x="418" y="735" font-size="11" text-anchor="middle" fill="#2f7d32">&lt;&lt;include&gt;&gt;</text>

  <!-- Fazer Login (Locação) -->
  <ellipse cx="545" cy="837" rx="140" ry="40" fill="#d9f2da" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="545" y="832" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e4d20">Fazer Login</text>
  <text x="545" y="849" font-size="12" text-anchor="middle" fill="#1e4d20">(Matrícula do Empregado e Senha)</text>

  <!-- Locação actor -->
  <g stroke="#2f7d32" stroke-width="2" fill="none">
    <circle cx="1090" cy="687" r="14" fill="#ffffff"/>
    <line x1="1090" y1="701" x2="1090" y2="747"/>
    <line x1="1060" y1="717" x2="1120" y2="717"/>
    <line x1="1090" y1="747" x2="1065" y2="782"/>
    <line x1="1090" y1="747" x2="1115" y2="782"/>
  </g>
  <text x="1090" y="802" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f7d32">Locação</text>

  <line x1="1063" y1="675" x2="686" y2="659" stroke="#222" stroke-width="1.3"/>
  <line x1="1063" y1="695" x2="665" y2="747" stroke="#222" stroke-width="1.3"/>
  <line x1="1063" y1="715" x2="685" y2="830" stroke="#222" stroke-width="1.3"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e5fae"/>
    </marker>
    <marker id="arrowr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b03030"/>
    </marker>
    <marker id="arrowo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c48a1e"/>
    </marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f7d32"/>
    </marker>
  </defs>
</svg>
