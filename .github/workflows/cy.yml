name: CI - Build e Testes

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build e Testes (JDK 17)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HenriqueAUTOCARS

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar com Maven
        run: mvn -B -ntp compile

      - name: Rodar testes (JUnit 5)
        run: mvn -B -ntp test

      - name: Publicar relatório de testes
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit
          path: HenriqueAUTOCARS/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Empacotar JAR
        run: mvn -B -ntp package -DskipTests

      - name: Publicar artefato (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: HenriqueAUTOCARS-jar
          path: HenriqueAUTOCARS/target/*.jar
          retention-days: 15